# worker_exporter.conf
#
# Drop this at /etc/worker_exporter.conf (or pass --config PATH).

[exporter]
# /metrics listen address + port. 19200 avoids the app exporter (19100) and
# pfcp-generator (9090). Prometheus scrapes <worker-ip>:19200/metrics.
bind = 0.0.0.0
port = 19200

[cpufreq]
# Cores to read scaling_cur_freq from.
#   list + ranges:  e.g.  2-5,8,10-12
#   or:             all   (every online cpu)
# Set this to the cores the DPDK app pins its workers to, so the series line up
# with the cores IPM is tuning.
cores = 2-5

# ---------------------------------------------------------------------------
# One [socket:<name>] section per monitored socket.
#   <name>  -> becomes the {name="..."} label
#   proto   -> udp | udp6 | tcp | tcp6   (drops only exist for udp/udp6)
#   port    -> local port to match
#   comm    -> OPTIONAL. Restrict to sockets owned by a process with this name
#              (/proc/<pid>/comm, truncated to 15 chars). Needs root, because it
#              reads other processes' /proc/<pid>/fd. Omit it to match by port
#              alone (no root needed).
#
# If the app uses SO_REUSEPORT (one socket per worker on the same port), all
# matching sockets are summed and worker_socket_count reports how many were
# found.
# ---------------------------------------------------------------------------

# PFCP control-plane socket on the vpe app (UDP/8805 is the standard PFCP port).
[socket:pfcp]
proto = udp
port  = 8805
comm  = vpe
